[workspace]
members = [
    "apps/experience",
    "crates/compositor-control-protocol",
    "crates/experience-host-protocol",
    "crates/experience-ir",
    "crates/linux-session",
    "crates/providers-fake",
    "crates/provider-state-service",
    "crates/revision-supervisor",
    "crates/runtime-luau",
    "crates/service-protocol",
    "crates/sos-compositor",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
async-channel = "2.5"
compositor-control-protocol = { path = "crates/compositor-control-protocol" }
experience-host-protocol = { path = "crates/experience-host-protocol" }
experience-ir = { path = "crates/experience-ir" }
providers-fake = { path = "crates/providers-fake" }
runtime-luau = { path = "crates/runtime-luau" }
log = "0.4"
provider-state-service = { path = "crates/provider-state-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
service-protocol = { path = "crates/service-protocol" }
thiserror = "2"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# Luau reports VM errors through C++ exceptions which are caught inside its
# protected-call boundary. Android must retain unwind tables for that path;
# panic=abort caused a timed-out candidate to terminate the process.
panic = "unwind"
