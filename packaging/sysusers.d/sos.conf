g sos-ipc -
u sos-compositor -:sos-ipc "SOS compositor" /var/lib/sos /usr/sbin/nologin
u sos-provider -:sos-ipc "SOS provider authority" /var/lib/sos /usr/sbin/nologin
u sos-supervisor -:sos-ipc "SOS revision supervisor" /var/lib/sos /usr/sbin/nologin
u sos-host -:sos-ipc "SOS experience host" /var/lib/sos /usr/sbin/nologin
u sos-agent -:sos-ipc "SOS resident agent" /var/lib/sos-agent /usr/sbin/nologin
