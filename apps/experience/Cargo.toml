[package]
name = "sos-experience"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["offline-fallback"]
offline-fallback = ["dep:providers-fake"]
gate-strict = []
aosp-system = ["dep:android-authority-protocol"]
core-native = ["aosp-system"]
core-provider-acceptance = ["core-native", "dep:android-provider-acceptance"]
linux-host = []

[lib]
name = "sos_experience"
crate-type = ["cdylib", "staticlib", "lib"]

[target.'cfg(target_os = "android")'.dependencies]
anyhow = "1"
android-activity = { version = "0.6", features = ["native-activity"] }
android-authority-protocol = { workspace = true, optional = true }
android-provider-acceptance = { path = "../../crates/android-provider-acceptance", optional = true }
android_logger = "0.15"
async-channel.workspace = true
experience-ir.workspace = true
experience-package.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui", default-features = false }
gpui-mobile = { path = "../../vendor/gpui-mobile", default-features = false, features = ["deeplink"] }
log.workspace = true
jni = "0.22"
libc = "0.2"
ndk = { version = "0.9", features = ["nativewindow"] }
providers-fake = { workspace = true, optional = true }
runtime-luau.workspace = true
serde.workspace = true
serde_json.workspace = true
service-protocol.workspace = true
sha2.workspace = true
unicode-segmentation = "1.12"
zeroize.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
experience-ir.workspace = true
providers-fake.workspace = true
runtime-luau.workspace = true
unicode-segmentation = "1.12"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
async-channel.workspace = true
compositor-control-protocol.workspace = true
experience-host-protocol.workspace = true
experience-package.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui", default-features = false }
gpui-platform = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui_platform", default-features = false, features = ["wayland"] }
gpui-linux = { path = "../../vendor/gpui-linux", package = "gpui_linux", default-features = false, features = ["wayland"] }
image = { version = "0.25", default-features = false }
log.workspace = true
pollster = "0.4"
provider-state-service.workspace = true
providers-linux.workspace = true
serde.workspace = true
serde_json.workspace = true
service-protocol.workspace = true
sha2.workspace = true
wgpu = { git = "https://github.com/zed-industries/wgpu.git", branch = "v29" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui", default-features = false }
gpui-mobile = { path = "../../vendor/gpui-mobile", default-features = false, features = ["deeplink"] }
libc = "0.2"
log.workspace = true
tempfile = "3"
zeroize.workspace = true

[[bin]]
name = "sos-experience-host"
path = "src/bin/sos-experience-host.rs"
required-features = ["linux-host"]
